[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
  bodmer/TFT_eSPI@^2.5.43

build_flags =
  -D USER_SETUP_LOADED=1
  -include ${PROJECT_DIR}/include/User_Setup.h

[env:test_native]
platform = native
test_framework = unity
test_build_src = yes
test_ignore =
  test_smoke_esp32_runtime
  test_udp_pipeline_esp32
build_flags =
  -Isrc
  -Itest/support/stubs
build_src_filter =
  +<application/**>
  +<adapters/display/**>
  +<adapters/telemetry/**>
  +<adapters/input/**>
  +<domain/**>
  +<ports/**>
  -<composition/**>
  -<adapters/motors/**>
  -<adapters/network/**>
  -<adapters/time/**>
  +<adapters/network/web/**>
  +<adapters/network/udp/**>
  +<adapters/network/wifi/**>

[env:test_native_coverage]
platform = native
test_framework = unity
test_build_src = yes
test_ignore =
  test_smoke_esp32_runtime
  test_udp_pipeline_esp32
build_flags =
  -Isrc
  -Itest/support/stubs
  --coverage
  -O0
build_src_filter =
  +<application/**>
  +<adapters/display/**>
  +<adapters/telemetry/**>
  +<adapters/input/**>
  +<domain/**>
  +<ports/**>
  -<composition/**>
  -<adapters/motors/**>
  -<adapters/network/**>
  -<adapters/time/**>
  +<adapters/network/web/**>
  +<adapters/network/udp/**>
  +<adapters/network/wifi/**>

[env:test_esp32_smoke]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
test_framework = unity
test_build_src = yes
test_filter = test_smoke_esp32_runtime
test_speed = 115200

lib_deps =
  bodmer/TFT_eSPI@^2.5.43

build_flags =
  -D USER_SETUP_LOADED=1
  -include ${PROJECT_DIR}/include/User_Setup.h
  -Isrc

build_src_filter =
  +<application/**>
  +<adapters/telemetry/**>
  +<domain/**>
  +<ports/**>
  -<composition/**>
  -<adapters/display/**>
  -<adapters/input/**>
  -<adapters/motors/**>
  -<adapters/network/**>
  -<adapters/time/**>

[env:test_esp32_udp_integration]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
test_framework = unity
test_build_src = yes
test_filter = test_udp_pipeline_esp32
test_speed = 115200

build_flags =
  -Isrc

build_src_filter =
  +<adapters/network/udp/**>
  +<adapters/telemetry/**>
  +<adapters/time/**>
  +<application/services/TelemetryService.cpp>
  +<domain/**>
  +<ports/**>
  -<composition/**>
  -<adapters/display/**>
  -<adapters/input/**>
  -<adapters/motors/**>
  -<adapters/network/web/**>
  -<adapters/network/wifi/**>
